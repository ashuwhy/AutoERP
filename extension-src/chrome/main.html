<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoERP</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/popup.css" />
</head>

<body>
    <header>
        <p class="name" id="name"><span id="version"></span></p>
    </header>

    <!-- One group per job. The shared name makes them an accordion: opening one closes the other. -->
    <details name="job" id="login-group">
        <summary>
            <h2>Login</h2>
            <span class="state" id="login-state"></span>
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </summary>
        <form id="login">
            <div class="stack" id="login-account">
                <input name="roll" placeholder="Roll number" aria-label="Roll number" autocomplete="off" spellcheck="false" required />
                <input name="password" type="password" placeholder="ERP password" aria-label="ERP password" autocomplete="off" required />
            </div>
            <div class="stack" id="login-answers" hidden>
                <div class="chips">
                    <span class="picked" id="login-for"></span>
                    <button type="button" id="login-back">Back</button>
                </div>
                <div class="stack asks" id="login-asks"></div>
            </div>
            <div class="chips" id="login-saved" hidden>
                <span class="picked" id="login-roll"></span>
                <button type="button" id="login-edit">Edit</button>
                <button type="button" id="forget">Forget</button>
            </div>
            <button class="btn secondary" id="login-go" type="submit">Continue</button>
            <button class="btn" id="open-erp" type="button" hidden>Open ERP</button>
            <p class="note" id="login-msg" role="status" hidden></p>
            <p class="hint" id="login-hint"></p>
        </form>
    </details>

    <details name="job" id="feedback-group">
        <summary>
            <h2>Admit card download</h2>
            <span class="state" id="feedback-state"></span>
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </summary>
        <form id="options">
            <section>
                <h3>Tone</h3>
                <div class="chips">
                    <label><input type="radio" name="tone" value="positive" checked /><span>Positive</span></label>
                    <label><input type="radio" name="tone" value="neutral" /><span>Neutral</span></label>
                    <label><input type="radio" name="tone" value="negative" /><span>Negative</span></label>
                </div>
                <p class="hint" id="tone-hint"></p>
            </section>

            <section>
                <h3>Forms</h3>
                <div class="chips">
                    <label><input type="radio" name="scope" value="all" checked /><span>All, one by one</span></label>
                    <label><input type="radio" name="scope" value="one" /><span>Open form only</span></label>
                </div>
                <p class="hint" id="scope-hint"></p>
            </section>

            <button class="btn" id="start" type="submit">Start filling</button>
            <p class="note" id="status" hidden></p>
        </form>
        <!-- Instead of the form above once ERP says every feedback form is in. -->
        <form id="admit" hidden>
            <button class="btn" id="admit-go" type="submit">Download admit card</button>
            <p class="note" id="admit-msg" role="status" hidden></p>
            <p class="hint" id="admit-hint"></p>
            <div class="chips">
                <button type="button" id="admit-fill">Fill forms anyway</button>
            </div>
        </form>
    </details>

    <details name="job" id="cdc-group">
        <summary>
            <h2>CDC boards</h2>
            <span class="state" id="cdc-state"></span>
            <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </summary>
        <form id="cdc">
            <div class="chips">
                <button type="button" id="cdc-on" role="switch" aria-checked="false">Show boards</button>
                <button type="button" id="forget-cdc" hidden>Forget CDC data</button>
            </div>
            <p class="hint">Sorts CDC's company and notice pages. Off: AutoERP draws nothing there and fetches nothing.</p>
        </form>
    </details>

    <footer>
        <a href="https://github.com/ashuwhy/AutoERP" target="_blank">Source</a>
        <a href="https://github.com/ashuwhy/AutoERP/blob/main/PRIVACY.md" target="_blank">Privacy</a>
        <a href="https://github.com/ashuwhy/AutoERP/issues" target="_blank">Report a problem</a>
        <a href="https://ashuwhy.com" target="_blank">ashuwhy.com</a>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
